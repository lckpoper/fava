<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoirFlix — Profile</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://image.tmdb.org" />
  </head>
  <body class="page-profile">
    <div class="app">
      <header class="site-header">
        <a class="logo" href="index.html">NoirFlix</a>
        <nav class="nav">
          <a href="index.html">Home</a>
          <a href="catalog.html">Explore</a>
          <a href="search.html">Search</a>
          <a href="profile.html" class="active">Profile</a>
        </nav>
        <button class="cta">Upgrade</button>
      </header>

      <section class="profile-hero">
        <div class="profile-card">
          <div class="avatar"></div>
          <div class="profile-info">
            <h1>Elena Marquez</h1>
            <p>Platinum Member • NoirFlix Premiere</p>
            <div class="profile-actions">
              <button class="primary">Manage Plan</button>
              <button>Account Settings</button>
            </div>
          </div>
        </div>
        <div class="profile-stats">
          <div>
            <h2>128</h2>
            <p>Films watched</p>
          </div>
          <div>
            <h2>4K HDR</h2>
            <p>Streaming quality</p>
          </div>
          <div>
            <h2>7.1 Atmos</h2>
            <p>Audio profile</p>
          </div>
        </div>
      </section>

      <section class="profile-shelves">
        <div class="section-header">
          <h2>Your Watchlist</h2>
          <a href="catalog.html">Edit</a>
        </div>
        <div class="row" data-row="watchlist"></div>
      </section>

      <section class="profile-shelves">
        <div class="section-header">
          <h2>Continue Watching</h2>
          <a href="catalog.html">Resume</a>
        </div>
        <div class="row" data-row="continue"></div>
      </section>

      <footer class="site-footer">
        <p>© 2025 NoirFlix Studios. A premium cinematic streaming experience.</p>
      </footer>
    </div>

    <script src="app.js"></script>
  </body>
</html>
